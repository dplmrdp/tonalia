name: Desplegar servidor de separación (Cloudflare Worker)

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar secretos
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF" ]; then
            echo "::notice::Falta CLOUDFLARE_API_TOKEN; el Worker no se despliega todavía."
            echo "skip=1" >> "$GITHUB_ENV"
          fi
      - name: Desplegar
        if: env.skip != '1'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: REPLICATE_API_TOKEN
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
